server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Chamadas da API vão para o backend pela rede do Docker: um único link (porta 5173) serve tudo,
    # o que permite expor o app por um túnel (ngrok, Cloudflare Tunnel) sem abrir a porta 8080
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Respostas do FinBot (Ollama) podem demorar
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 20m;
    }

    # SPA: qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
