spring.datasource.url=jdbc:postgresql://localhost:5432/edufinance
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Force servlet mode when webflux is on classpath (needed for WebClient without full reactive stack)
spring.main.web-application-type=servlet

# Ollama AI configuration
ollama.api.url=http://100.83.132.45:11434
ollama.default.model=llama3.2:1b

# FinBot, modo fechado: pasta com os documentos (.pdf, .txt, .md) da base de conhecimento
finbot.knowledge.dir=base-conhecimento

# Senha do painel de administração da IA (escolha do servidor Ollama usado por todos os usuários).
# Troque este valor, ou defina a variável de ambiente FINBOT_ADMIN_PASSWORD.
finbot.admin.password=edufinance
